[project]
name = "reflex-react-joyride"
dynamic = ["version"]
description = "Reflex custom component for react-joyride: guided product tours and onboarding walkthroughs, with controlled mode, theming, custom tooltips and Python-driven controls"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Ernesto Crespo", email = "ecrespo@gmail.com" }]
keywords = [
    "reflex",
    "reflex-custom-components",
    "react-joyride",
    "joyride",
    "tour",
    "onboarding",
    "walkthrough",
    "product-tour",
]
dependencies = ["reflex>=0.10.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/ecrespo/reflex-react-joyride"
Source = "https://github.com/ecrespo/reflex-react-joyride"
Issues = "https://github.com/ecrespo/reflex-react-joyride/issues"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning", "hatch-reflex-pyi"]
build-backend = "hatchling.build"

[tool.hatch.version]
# The version comes from the git tag (`v0.3.0` builds 0.3.0).
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"

[tool.hatch.build]
# The .pyi stubs are generated at build time and are not committed.
artifacts = ["/src/**/*.pyi"]

[tool.hatch.build.targets.sdist]
exclude = ["/demo", "/docs", "/.github"]

[tool.hatch.build.hooks.reflex-pyi]
dependencies = ["ruff", "reflex>=0.10.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".web", ".venv", ".devtools", "reflex.lock", "*.pyi"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "BLE",  # flake8-blind-except
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line length is handled by the formatter
    "RUF012",  # Reflex State class attrs are intentionally mutable defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pyright>=1.1.400",
    "pytest>=8.0",
    "ruff>=0.17",
]
