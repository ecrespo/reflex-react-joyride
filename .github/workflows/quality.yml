name: Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  # Run every JavaScript action on Node 24, and use Node 24 for the toolchain (see .nvmrc).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Install (generates the .pyi stubs pyright reads)
        run: uv sync --locked
      - name: pre-commit (ruff, pyright and file hygiene)
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Run pytest
        run: uv run --locked pytest

  demo:
    name: Demo app compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Compile the demo
        working-directory: demo
        run: uv run --locked reflex compile

  package:
    name: Build and check package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Build sdist and wheel (generates the .pyi stubs)
        run: uv build
      - name: Version comes from the git tags
        run: |
          ls dist/
          if ls dist/ | grep -q -- '-0\.0\.0'; then
            echo "::error::Built version 0.0.0, the git tags were not fetched"
            exit 1
          fi
      - name: Check metadata renders on PyPI
        run: uvx twine check --strict dist/*
      - name: Wheel ships the JSX wrapper and type stubs
        run: |
          unzip -l dist/*.whl | tee /tmp/wheel.txt
          for f in joyride_tour.jsx joyride.pyi py.typed; do
            grep -q "reflex_react_joyride/$f" /tmp/wheel.txt || { echo "::error::$f missing from wheel"; exit 1; }
          done
      - name: Smoke test the built wheel
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/python -c "import reflex_react_joyride as rjr; print(rjr.__version__); rjr.joyride(steps=[rjr.Step(target='#a', content='hi')])"
