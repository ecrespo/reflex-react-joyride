name: Release

# The version comes from the tag (uv-dynamic-versioning). Merge the release
# into main, then tag the merge commit to publish:
#   git switch main && git pull && git tag v0.3.0 && git push origin v0.3.0
on:
  push:
    tags: ["v*.*.*"]

env:
  # Run every JavaScript action on Node 24, and use Node 24 for the toolchain (see .nvmrc).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Tag must point to a commit on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main; merge the release PR first"
            exit 1
          fi
      - name: Tests
        run: uv run --locked pytest
      - name: Build sdist and wheel (generates the .pyi stubs)
        run: uv build
      - name: Built version must match the tag
        run: |
          wheel=$(ls dist/*.whl)
          version=$(basename "$wheel" | cut -d- -f2)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Built version ${version} does not match tag ${GITHUB_REF_NAME}"
            exit 1
          fi
          unzip -l "$wheel" | grep -q 'reflex_react_joyride/joyride.pyi' || { echo "::error::joyride.pyi missing from wheel"; exit 1; }
      - name: Check metadata
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/reflex-react-joyride/
    permissions:
      id-token: write # Trusted Publishing (OIDC), no API token needed
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Create the release with the built files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag --generate-notes
